services:
  laburauto-db-migrate:
    build: 
      context: .
      dockerfile: apps/server/Dockerfile
      target: build
    command: ["pnpm", "--filter=server", "run", "db:migrate"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/laburauto}
    networks:
      - shared_db_net

  docuseal:
    image: docuseal/docuseal:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DOCUSEAL_DATABASE_URL:-postgres://${DOCUSEAL_DB_USER:-docuseal}:${DOCUSEAL_DB_PASSWORD:-docuseal}@docuseal-db:5432/${DOCUSEAL_DB_NAME:-laburauto_docuseal}}
      SECRET_KEY_BASE: ${DOCUSEAL_SECRET_KEY_BASE:-change-me-docuseal-secret-key}
      FORCE_SSL: ${DOCUSEAL_FORCE_SSL:-false}
    networks:
      - shared_db_net


  server:
    build: 
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/laburauto}
      JWT_SECRET: ${JWT_SECRET:-secret}
      AUTHENTIK_ENABLED: ${AUTHENTIK_ENABLED:-false}
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:-https://auth.example.com/application/o/laburauto/}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      AUTHENTIK_REDIRECT_URI: ${AUTHENTIK_REDIRECT_URI:-http://localhost:3000/api/auth/sso/authentik/callback}
      AUTHENTIK_SCOPES: ${AUTHENTIK_SCOPES:-openid profile email groups}
      AUTHENTIK_ADMIN_GROUP: ${AUTHENTIK_ADMIN_GROUP:-laburauto-admins}
      AUTHENTIK_REQUIRED_DOMAIN: ${AUTHENTIK_REQUIRED_DOMAIN:-}
      AUTH_SSO_STATE_SECRET: ${AUTH_SSO_STATE_SECRET:-change-me-state-secret}
      APP_URL: ${APP_URL:-http://localhost:5173}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-api_key}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.info}
      BYTESCALE_ACCOUNT_ID: ${BYTESCALE_ACCOUNT_ID:-account_id}
      BYTESCALE_API_KEY_ID: ${BYTESCALE_API_KEY_ID:-api_key_id}
      BYTESCALE_API_KEY_HMAC: ${BYTESCALE_API_KEY_HMAC:-api_key_hmac}
      BYTESCALE_API_KEY: ${BYTESCALE_API_KEY:-api_key}
      BYTESCALE_SECRET_KEY_ID: ${BYTESCALE_SECRET_KEY_ID:-secret_key_id}
      BYTESCALE_SECRET_KEY_HMAC: ${BYTESCALE_SECRET_KEY_HMAC:-secret_key_hmac}
      BYTESCALE_SECRET_KEY: ${BYTESCALE_SECRET_KEY:-secret_key}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-api_key}
      DLOCAL_API_KEY: ${DLOCAL_API_KEY:-api_key}
      DLOCAL_SECRET_KEY: ${DLOCAL_SECRET_KEY:-secret_key}
      DLOCAL_SMARTFIELDS_API_KEY: ${DLOCAL_SMARTFIELDS_API_KEY:-smartfields_api_key}
      DLOCAL_PLAN_TOKEN: ${DLOCAL_PLAN_TOKEN:-plan_token}
      DLOCAL_ENVIRONMENT: ${DLOCAL_ENVIRONMENT:-environment}
      RESEND_API_KEY: ${RESEND_API_KEY:-api_key}
      RESEND_SENDER: ${RESEND_SENDER:-sender}
      CLICKSEND_API_KEY: ${CLICKSEND_API_KEY:-api_key}
      CLICKSEND_API_USERNAME: ${CLICKSEND_API_USERNAME:-api_username}
      CLICKSEND_NUMBER: ${CLICKSEND_NUMBER:-number}
      DOCUSEAL_ENABLED: ${DOCUSEAL_ENABLED:-true}
      DOCUSEAL_INTERNAL_URL: ${DOCUSEAL_INTERNAL_URL:-http://docuseal:3000}
      DOCUSEAL_PUBLIC_URL: ${DOCUSEAL_PUBLIC_URL:-http://localhost:3001}
      DOCUSEAL_API_KEY: ${DOCUSEAL_API_KEY:-}
      DOCUSEAL_WEBHOOK_SECRET: ${DOCUSEAL_WEBHOOK_SECRET:-}
      DOCUSEAL_TEMPLATE_NAME_REGEX: ${DOCUSEAL_TEMPLATE_NAME_REGEX:-}
    depends_on:
      laburauto-db-migrate:
        condition: service_completed_successfully
      docuseal:
        condition: service_started
    networks:
      - shared_db_net

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      target: client
      args:
        VITE_API_URL: ${VITE_API_URL:-https://auto.askn.us/api}
        VITE_AUTHENTIK_ENABLED: ${VITE_AUTHENTIK_ENABLED:-false}
        VITE_SSO_LOGIN_URL: ${VITE_SSO_LOGIN_URL:-http://localhost:3000/api/auth/sso/authentik/start}
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VITE_API_URL: ${VITE_API_URL:-https://auto.askn.us/api}
      VITE_AUTHENTIK_ENABLED: ${VITE_AUTHENTIK_ENABLED:-false}
      VITE_SSO_LOGIN_URL: ${VITE_SSO_LOGIN_URL:-http://localhost:3000/api/auth/sso/authentik/start}
    depends_on:
      - server
    networks:
      - shared_db_net

volumes:
  db-data:
  docuseal-db-data:

networks:
  shared_db_net:
    external: true
