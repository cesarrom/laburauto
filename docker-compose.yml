services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: laburauto
    volumes:
      - db-data:/var/lib/postgresql/data

  server:
    build: 
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/laburauto
      PORT: 3000
      NODE_ENV: production
      BASE_URL: ${API_BASE_URL:-https://auto.askn.us}
      FRONTEND_URL: ${FRONTEND_URL:-https://auto.askn.us}
      VITE_API_URL: ${VITE_API_URL:-https://api.auto.askn.us/api}
    depends_on:
      - db
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      target: client
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://auto.askn.us/api}
    depends_on:
      - server

volumes:
  db-data:
