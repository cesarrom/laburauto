version: '3.8'

services:
  test-db:
    image: postgres:15
    container_name: laburauto-test-db
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: laburauto_test
    ports:
      - "5434:5432"  # Different port to avoid conflicts with dev DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d laburauto_test"]
      interval: 2s
      timeout: 5s
      retries: 5
